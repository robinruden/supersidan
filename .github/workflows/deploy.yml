name: Publish test site to one.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-com-test
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SITE_URL: https://nyasidan.supersidan.se
      VITE_NOINDEX: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:seo
      - name: Install SFTP password helper
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Upload built website
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_TEST_PATH }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          if [[ "${SFTP_PATH%/}" != '/customers/c/8/c/cx4yqvxhn/webroots/7c27d013' ]]; then
            echo 'SFTP_TEST_PATH must point to the verified webroot for nyasidan.supersidan.se'
            exit 1
          fi
          bash scripts/deploy-sftp.sh
